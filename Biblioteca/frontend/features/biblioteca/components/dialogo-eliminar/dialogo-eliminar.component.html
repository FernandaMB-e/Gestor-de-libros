<h2 mat-dialog-title>
  Eliminar libro
</h2>

<mat-dialog-content>

  ¿Deseas eliminar el libro
  <strong>{{ data.titulo }}</strong>?

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    [mat-dialog-close]="false">

    Cancelar

  </button>

  <button
    mat-raised-button
    color="warn"
    [mat-dialog-close]="true">

    Eliminar

  </button>

</mat-dialog-actions>
