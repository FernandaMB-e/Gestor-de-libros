<div class="header-principal">
  
  <div class="logo-contenedor">
    <img src="/img/icono-biblioteca.jpg" alt="Logo" class="logo-img">
    <h1 class="logo-biblioteca">Biblioteca</h1>
  </div>

  <div class="acciones-usuario">
    
    <button mat-icon-button (click)="irAPerfil()" matTooltip="Ver perfil" class="btn-perfil">
      <mat-icon>account_circle</mat-icon>
    </button>

    <button mat-button type="button" (click)="cerrarSesion()">
      Cerrar sesión
    </button>

  </div>
</div>

<app-barra-principal [nombreUsuario]="nombreUsuario"></app-barra-principal>

<main class="app-container">
  
  <div class="contenedor-acciones-top" *ngIf="totalLibros > 0">
    <button mat-flat-button class="btn-agregar-top" (click)="irAgregarLibro()">
      <mat-icon>add</mat-icon> Agregar libro
    </button>
  </div>

  <app-buscador-filtros 
    (filtrosCambio)="filtrarLibros($event)">
  </app-buscador-filtros>

  <div class="estado-vacio" *ngIf="totalLibros === 0">
    <div class="icono-vacio">
      <mat-icon>auto_stories</mat-icon> 
    </div>

    <h2>No tienes ningún libro por el momento</h2>
    <p>Puedes comenzar a agregar libros pulsando el siguiente botón</p>
    
    <button mat-flat-button class="btn-agregar-center" (click)="irAgregarLibro()">
      Agregar libro
    </button>
  </div>

  <div class="layout-principal" *ngIf="totalLibros > 0">
    
    <div class="seccion-libros">
      <h2 class="titulo-seccion">{{ tituloSeccion }}</h2>

      <div class="mensaje-sin-resultados" *ngIf="libros.length === 0 && busquedaActiva">
        <p>{{ obtenerMensajeVacio() }}</p>
      </div>

      <div class="grid-tarjetas" *ngIf="libros.length > 0">
        <app-libro-card 
          *ngFor="let libro of libros" 
          [libro]="libro">
        </app-libro-card>
      </div>
    </div>

    <div class="seccion-sidebar">
      <app-resumen-estadisticas></app-resumen-estadisticas>
    </div>

  </div>

</main>
